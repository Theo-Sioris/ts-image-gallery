<mat-card appearance="outlined">
  <div [attr.aria-label]="isFavorite() ? 'Photograph saved to favorites' : 'Select photograph'"
       (click)="imageClicked.emit(image())"
       [class.loading]="!loaded() && !failed()">
    @if (!failed()) {
    <img [src]="imageUrl()" alt="Gallery photograph"
      width="300" height="300" loading="lazy" decoding="async"
      [class.loaded]="loaded()" (load)="loaded.set(true)" (error)="failed.set(true)" />
    } @else {
    <p class="fallback" role="status">Image unavailable</p>
    }
  </div>
  @if (isFavorite()) {
    <mat-icon class="favorite-indicator" fontSet="material-symbols-outlined"
      aria-label="Saved to favorites" [attr.aria-hidden]="false">star</mat-icon>
  }
</mat-card>
